# Start Window Numbering at 1
set -g base-index 1

# Aggressive resize
setw -g aggressive-resize on

# Mouse: click tabs to switch, click panes to focus, drag borders, scroll
set -g mouse on

# Clickable tab bar
set -g status-style "bg=colour234,fg=colour245"
set -g status-left ""
set -g status-right " #[fg=colour108]#H "
set -g status-justify left

# Inactive tab
set -g window-status-format "  #I #W  "
set -g window-status-style "bg=colour234,fg=colour245"

# Active tab
set -g window-status-current-format "  #I #W  "
set -g window-status-current-style "bg=colour24,fg=colour255,bold"

# Tab for a window with unread output
set -g window-status-activity-style "bg=colour234,fg=colour179"
setw -g monitor-activity on
set -g visual-activity off

# No gap between tabs, so they read as one strip
set -g window-status-separator ""

# Let programs set the window name, but keep manual renames sticky
setw -g automatic-rename on
set -g allow-rename off

# Middle-click a tab to close it
bind -n MouseDown2Status kill-window

# Double-click empty status bar space to open a new window
bind -n DoubleClick1StatusDefault new-window

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"
